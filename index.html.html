<!DOCTYPE html>
<html data-palette="violet" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shree Roofing Solutions — Missed Calls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --acc-rgb: 138,180,255; --blue-rgb: 199,210,230;
    --bg: #070B16; --surface: #0E1424; --surface-2: #151C30; --ink: #EEF2FA; --ink-soft: #AAB3C5; --ink-faint: #6B7488;
    --line: #1D2640; --accent: #8AB4FF; --accent-soft: #14203D; --blue: #C7D2E6; --blue-soft: #1A2236;
    --good: #5FD3A8; --good-soft: #10241E; --danger: #F0716B;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] {
    --bg: #F4F6FB; --surface: #FFFFFF; --surface-2: #F8F9FD; --ink: #0B1020; --ink-soft: #565F75; --ink-faint: #959DB0;
    --line: #DFE4F0; --accent: #2F4FA8; --accent-soft: #E3EAFA; --blue: #5B6A8A; --blue-soft: #E9ECF4;
    --good: #1F8F68; --good-soft: #E1F4EC; --danger: #C4453B;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(ellipse 900px 520px at 100% -10%, rgba(var(--acc-rgb),0.10), transparent 55%),
      radial-gradient(ellipse 700px 500px at -5% 100%, rgba(var(--blue-rgb),0.08), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 52px 28px 90px; }

  header.masthead {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap;
    padding-bottom: 26px; margin-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .brand-eyebrow { font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; font-weight: 600; }
  .masthead h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(28px, 4vw, 38px); margin: 0; line-height: 1.05; letter-spacing: -0.01em; }
  .status-block { text-align: right; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .status { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--ink-faint); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(var(--acc-rgb),0.5); animation: pulseDot 2.2s ease-out infinite; }
  .dot.error { background: var(--danger); animation: none; box-shadow: none; }
  @keyframes pulseDot { 0% { box-shadow: 0 0 0 0 rgba(var(--acc-rgb),0.4); } 70% { box-shadow: 0 0 0 7px rgba(var(--acc-rgb),0); } 100% { box-shadow: 0 0 0 0 rgba(var(--acc-rgb),0); } }
  button.refresh { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: all .15s ease; }
  button.refresh:hover { border-color: var(--accent); color: var(--accent); }
  button.refresh:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 36px 0 34px; }
  .stat {
    padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; cursor: pointer;
  }
  .stat:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -18px rgba(0,0,0,0.6); }
  .stat.active { border-color: var(--stat-accent, var(--accent)); background: var(--stat-soft, var(--accent-soft)); }
  .stat.active .num { color: var(--stat-accent, var(--accent)); }
  .stat-icon { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--stat-soft, var(--accent-soft)); color: var(--stat-accent, var(--accent)); margin-bottom: 14px; }
  .stat .label { font-size: 12px; color: var(--ink-faint); margin-bottom: 6px; }
  .stat .num { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 30px; line-height: 1; color: var(--ink); }

  .chart-block { margin: 0 0 34px; padding: 20px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .chart-label { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.04em; }
  .chart-bars { display: flex; align-items: flex-end; gap: 12px; height: 54px; }
  .chart-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 9px; height: 100%; justify-content: flex-end; }
  .chart-bar { width: 100%; max-width: 32px; background: var(--accent); border-radius: 4px 4px 2px 2px; min-height: 2px; opacity: .6; transition: opacity .15s; }
  .chart-bar-col:hover .chart-bar { opacity: 1; }
  .chart-count { font-size: 10px; color: var(--ink-faint); }
  .chart-day { font-size: 10.5px; color: var(--ink-faint); }

  .section-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 18px; flex-wrap: wrap; }
  .section-title { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 18px; margin: 0; }
  .search-inline {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    font-family: 'Inter', sans-serif; font-size: 13px; padding: 9px 15px; border-radius: 9px;
    outline: none; transition: border-color .15s ease, width .15s ease; width: 210px; max-width: 100%;
  }
  .search-inline::placeholder { color: var(--ink-faint); }
  .search-inline:focus { border-color: var(--accent); width: 250px; }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-bottom: 36px; }
  .call-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; animation: fadeIn .4s ease both;
  }
  .call-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 14px 30px -18px rgba(0,0,0,0.6); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-time { font-size: 11px; color: var(--ink-faint); }
  .card-name { font-weight: 700; font-size: 16px; margin-bottom: 10px; font-family: 'Fraunces', Georgia, serif; }
  .card-sub { font-size: 13px; color: var(--ink-soft); line-height: 1.5; -webkit-line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 12px; min-height: 18px; }
  .card-foot { font-size: 11.5px; color: var(--accent); font-weight: 600; border-top: 1px solid var(--line); padding-top: 10px; }
  .badge { font-size: 11px; padding: 4px 11px; border-radius: 20px; background: var(--good-soft); color: var(--good); font-weight: 600; }
  .badge.no-reply { background: rgba(217,100,90,0.12); color: var(--danger); }

  .empty { padding: 60px 30px; text-align: center; color: var(--ink-faint); font-size: 14.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .empty svg { margin-bottom: 14px; opacity: .45; color: var(--accent); }
  .empty strong { display: block; margin-bottom: 6px; color: var(--ink-soft); font-weight: 700; font-family: 'Fraunces', Georgia, serif; font-size: 17px; }
  .error-box { background: var(--surface); border-left: 3px solid var(--danger); padding: 18px 20px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; border-radius: 10px; }
  .error-box strong { color: var(--ink); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,12,18,0.65); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; animation: fadeIn .2s ease both;
  }
  .modal-box {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; max-width: 460px; width: 100%;
    max-height: 82vh; overflow-y: auto; padding: 26px 28px; box-shadow: 0 30px 80px -24px rgba(0,0,0,0.7);
  }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .modal-title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 20px; margin: 0; }
  .modal-close { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-faint); width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1; flex-shrink: 0; }
  .modal-close:hover { border-color: var(--accent); color: var(--accent); }
  .modal-meta { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 18px; }
  .modal-section-label { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 10px; }
  .modal-msg-text { font-size: 13.5px; color: var(--ink-soft); line-height: 1.65; white-space: pre-line; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  @media (max-width: 640px) { .stats { grid-template-columns: 1fr; row-gap: 12px; } }

  /* ---- Premium layer ---- */
  :root { --glass-a: rgba(255,255,255,0.055); --glass-b: rgba(255,255,255,0.015); --glass-line: rgba(255,255,255,0.09); --hi: rgba(255,255,255,0.07); --sh: rgba(0,0,0,0.85); }
  :root[data-theme="light"] { --glass-a: rgba(255,255,255,0.95); --glass-b: rgba(255,255,255,0.7); --glass-line: rgba(var(--acc-rgb),0.2); --hi: rgba(255,255,255,0.9); --sh: rgba(30,40,90,0.30); }
  body {
    background:
      radial-gradient(ellipse 1000px 600px at 90% -15%, rgba(var(--acc-rgb),0.16), transparent 58%),
      radial-gradient(ellipse 800px 560px at -10% 105%, rgba(var(--blue-rgb),0.09), transparent 58%),
      radial-gradient(ellipse 1100px 700px at 50% -20%, rgba(0,0,0,0), rgba(0,0,0,0.3) 90%),
      var(--bg);
    background-attachment: fixed;
  }
  .wrap { max-width: 980px; padding-top: 64px; }
  header.masthead { border-bottom: 1px solid transparent; border-image: linear-gradient(90deg, var(--accent), var(--line) 40%, transparent) 1; padding-bottom: 30px; }
  .brand-eyebrow { letter-spacing: 0.22em; font-size: 11px; display: flex; align-items: center; gap: 12px; }
  .brand-eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--accent); }
  .masthead h1 { font-weight: 500; font-style: italic; font-size: clamp(34px, 5vw, 52px); letter-spacing: -0.02em; text-shadow: 0 0 32px rgba(var(--acc-rgb),0.22); }
  .status { letter-spacing: 0.02em; }
  button.refresh { background: transparent; border-radius: 999px; padding: 9px 20px; letter-spacing: 0.04em; }
  button.refresh:hover { box-shadow: 0 0 0 4px rgba(var(--acc-rgb),0.12); }

  .stat, .chart-block, .call-card, .empty, .error-box {
    background: linear-gradient(155deg, var(--glass-a), var(--glass-b));
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--glass-line); border-radius: 16px;
    box-shadow: 0 1px 0 var(--hi) inset, 0 22px 44px -26px var(--sh);
  }
  .stat { position: relative; padding: 22px 24px; overflow: hidden; }
  .stat::after { content: ""; position: absolute; left: 24px; right: 24px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--stat-accent, var(--accent)), transparent); opacity: .55; }
  .stat:hover { transform: translateY(-3px); box-shadow: 0 1px 0 var(--hi) inset, 0 28px 50px -22px var(--sh), 0 0 32px -8px color-mix(in srgb, var(--stat-accent, var(--accent)) 45%, transparent); }
  .stat.active { background: linear-gradient(155deg, color-mix(in srgb, var(--stat-accent, var(--accent)) 14%, transparent), var(--glass-b)); border-color: color-mix(in srgb, var(--stat-accent, var(--accent)) 55%, transparent); }
  .stat-icon { border-radius: 50%; width: 34px; height: 34px; border: 1px solid color-mix(in srgb, var(--stat-accent, var(--accent)) 35%, transparent); background: transparent; }
  .stat .label { text-transform: uppercase; letter-spacing: 0.14em; font-size: 10.5px; }
  .stat .num { font-weight: 500; font-size: 40px; font-variant-numeric: lining-nums; letter-spacing: -0.02em; }

  .chart-block { padding: 24px 26px; }
  .chart-label { letter-spacing: 0.16em; font-size: 10.5px; }
  .chart-bar { background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 25%, transparent)); border-radius: 6px 6px 2px 2px; opacity: .85; }
  .chart-bar-col:hover .chart-bar { box-shadow: 0 0 18px -2px var(--accent); }

  .section-title { font-style: italic; font-weight: 500; font-size: 24px; letter-spacing: -0.01em; }
  .search-inline { border-radius: 999px; padding: 10px 18px; background: var(--glass-b); border-color: var(--glass-line); }
  .search-inline:focus { box-shadow: 0 0 0 4px rgba(var(--acc-rgb),0.12); }

  .call-card { padding: 20px 22px; position: relative; overflow: hidden; }
  .call-card::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 2px; background: linear-gradient(180deg, transparent, var(--accent), transparent); opacity: 0; transition: opacity .2s; }
  .call-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: 0 1px 0 var(--hi) inset, 0 26px 48px -20px var(--sh), 0 0 28px -8px rgba(var(--acc-rgb),0.35); }
  .call-card:hover::before { opacity: 1; }
  .card-name { font-weight: 500; font-size: 19px; letter-spacing: -0.01em; }
  .card-time { letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px; }
  .card-foot { letter-spacing: 0.08em; text-transform: uppercase; font-size: 10.5px; border-top-color: var(--glass-line); }
  .badge { letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px; border: 1px solid color-mix(in srgb, var(--good) 30%, transparent); }
  .badge.no-reply { border-color: color-mix(in srgb, var(--danger) 35%, transparent); }

  .modal-overlay { background: rgba(3,5,12,0.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .modal-box { border-radius: 20px; background: linear-gradient(155deg, var(--surface-2), var(--surface)); border-color: var(--glass-line); box-shadow: 0 1px 0 var(--hi) inset, 0 40px 90px -28px rgba(0,0,0,0.8), 0 0 60px -20px rgba(var(--acc-rgb),0.25); }
  .modal-title { font-style: italic; font-weight: 500; font-size: 24px; }
  .modal-close { border-radius: 50%; }
  .modal-section-label { letter-spacing: 0.16em; }
  ::selection { background: var(--accent); color: #070B16; }

  /* ---- Palettes ---- */
  :root[data-palette="mono"] { --bg:#09090A;--surface:#111113;--surface-2:#18181B;--ink:#F5F5F4;--ink-soft:#A8A8AE;--ink-faint:#6B6B72;--line:#232327;--accent:#FFFFFF;--accent-soft:#1E1E22;--blue:#9A9AA3;--blue-soft:#1A1A1E;--good:#7DD9B1;--good-soft:#12211A;--danger:#F0746B;--acc-rgb:255,255,255;--blue-rgb:154,154,163; }
  :root[data-palette="mono"][data-theme="light"] { --bg:#F5F5F4;--surface:#FFFFFF;--surface-2:#FAFAF9;--ink:#0A0A0B;--ink-soft:#58585E;--ink-faint:#9A9AA0;--line:#E4E4E2;--accent:#0A0A0B;--accent-soft:#ECECEA;--blue:#6B6B72;--blue-soft:#EFEFED;--good:#1F8F68;--good-soft:#E1F4EC;--danger:#C4453B;--acc-rgb:10,10,11;--blue-rgb:107,107,114; }
  :root[data-palette="emerald"] { --bg:#040D0A;--surface:#0A1713;--surface-2:#10211B;--ink:#EEF5F0;--ink-soft:#A5B8AE;--ink-faint:#657A70;--line:#173027;--accent:#2FD6A0;--accent-soft:#0E2A21;--blue:#D9CFAE;--blue-soft:#242117;--good:#7BE0B5;--good-soft:#0F2A20;--danger:#F0746B;--acc-rgb:47,214,160;--blue-rgb:217,207,174; }
  :root[data-palette="emerald"][data-theme="light"] { --bg:#F2F7F4;--surface:#FFFFFF;--surface-2:#F7FAF8;--ink:#07130E;--ink-soft:#4F6258;--ink-faint:#8FA096;--line:#DCE8E1;--accent:#0B7A56;--accent-soft:#DDF2E8;--blue:#8A7A3E;--blue-soft:#F3EFD9;--good:#0B7A56;--good-soft:#DDF2E8;--danger:#C4453B;--acc-rgb:11,122,86;--blue-rgb:138,122,62; }
  :root[data-palette="rose"] { --bg:#0D0809;--surface:#171011;--surface-2:#201718;--ink:#F7EEEA;--ink-soft:#BBA9A3;--ink-faint:#7A6863;--line:#2C2022;--accent:#E8A58C;--accent-soft:#2B1A16;--blue:#EBD3C8;--blue-soft:#2A201C;--good:#7DD9B1;--good-soft:#12211A;--danger:#F0746B;--acc-rgb:232,165,140;--blue-rgb:235,211,200; }
  :root[data-palette="rose"][data-theme="light"] { --bg:#FBF3EF;--surface:#FFFFFF;--surface-2:#FDF8F5;--ink:#1A0E0B;--ink-soft:#6B5750;--ink-faint:#A8958D;--line:#EEDDD5;--accent:#B0583A;--accent-soft:#F8E4DB;--blue:#8A6B5E;--blue-soft:#F3E8E2;--good:#1F8F68;--good-soft:#E1F4EC;--danger:#C4453B;--acc-rgb:176,88,58;--blue-rgb:138,107,94; }
  :root[data-palette="gold"] { --bg:#0B0B0F;--surface:#14141A;--surface-2:#1B1B23;--ink:#F4EFE6;--ink-soft:#B3AEA3;--ink-faint:#76736C;--line:#26262F;--accent:#C9A96E;--accent-soft:#2A2418;--blue:#A9B4C2;--blue-soft:#1E232B;--good:#6FBF9A;--good-soft:#15251E;--danger:#D9695E;--acc-rgb:201,169,110;--blue-rgb:169,180,194; }
  :root[data-palette="gold"][data-theme="light"] { --bg:#F5F2EC;--surface:#FFFFFF;--surface-2:#FAF8F3;--ink:#15151A;--ink-soft:#5E5B54;--ink-faint:#9A968C;--line:#E6E0D2;--accent:#96762E;--accent-soft:#F3EAD3;--blue:#5F6B7A;--blue-soft:#E9ECF0;--good:#2F8F6B;--good-soft:#E4F3ED;--danger:#C4453B;--acc-rgb:150,118,46;--blue-rgb:95,107,122; }
  :root[data-palette="ice"] { --bg:#070B16;--surface:#0E1424;--surface-2:#151C30;--ink:#EEF2FA;--ink-soft:#AAB3C5;--ink-faint:#6B7488;--line:#1D2640;--accent:#8AB4FF;--accent-soft:#14203D;--blue:#C7D2E6;--blue-soft:#1A2236;--good:#5FD3A8;--good-soft:#10241E;--danger:#F0716B;--acc-rgb:138,180,255;--blue-rgb:199,210,230; }
  :root[data-palette="ice"][data-theme="light"] { --bg:#F4F6FB;--surface:#FFFFFF;--surface-2:#F8F9FD;--ink:#0B1020;--ink-soft:#565F75;--ink-faint:#959DB0;--line:#DFE4F0;--accent:#2F4FA8;--accent-soft:#E3EAFA;--blue:#5B6A8A;--blue-soft:#E9ECF4;--good:#1F8F68;--good-soft:#E1F4EC;--danger:#C4453B;--acc-rgb:47,79,168;--blue-rgb:91,106,138; }
  ::selection { color: var(--bg); }

  /* ---- Luxe Black + Electric Amber ---- */
  :root[data-palette="lux"] { --bg:#040404;--surface:#0C0B09;--surface-2:#14120E;--ink:#FBF7EE;--ink-soft:#BDB6A8;--ink-faint:#7A745F;--line:#2A2314;--accent:#FFB81C;--accent-soft:#2B2008;--blue:#FFE08A;--blue-soft:#2B2610;--good:#3DE0A5;--good-soft:#0E241B;--danger:#FF5A5F;--acc-rgb:255,184,28;--blue-rgb:255,224,138; }
  :root[data-palette="lux"][data-theme="light"] { --bg:#FBF7EE;--surface:#FFFFFF;--surface-2:#FFFBF2;--ink:#14110A;--ink-soft:#6A614C;--ink-faint:#A39A82;--line:#EDE3CC;--accent:#C77700;--accent-soft:#FFF0CC;--blue:#9A7A1E;--blue-soft:#FBF1D2;--good:#13875F;--good-soft:#DDF3EA;--danger:#C4453B;--acc-rgb:199,119,0;--blue-rgb:154,122,30; }
  :root[data-palette] body { background:
      radial-gradient(ellipse 900px 520px at 85% -12%, rgba(var(--acc-rgb),0.26), transparent 60%),
      radial-gradient(ellipse 700px 480px at -8% 108%, rgba(var(--acc-rgb),0.10), transparent 60%),
      var(--bg); background-attachment: fixed; }
  .masthead h1 { background: linear-gradient(180deg, #fff 10%, var(--acc-hi) 55%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; text-shadow: none; filter: drop-shadow(0 0 22px rgba(var(--acc-rgb),.35)); }
  :root[data-theme="light"] .masthead h1 { background: none; -webkit-text-fill-color: var(--ink); color: var(--ink); filter: none; }
  .brand-eyebrow { font-weight: 600; }
  .brand-eyebrow::before { height: 2px; width: 34px; background: linear-gradient(90deg, var(--accent), transparent); }
  .dot { box-shadow: 0 0 12px 2px rgba(var(--acc-rgb),.7); }
  .stat { border-color: rgba(var(--acc-rgb),.14); }
  .stat .num { background: linear-gradient(180deg, var(--ink), color-mix(in srgb, var(--stat-accent, var(--accent)) 85%, var(--ink))); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 46px; }
  .stat.active { box-shadow: 0 1px 0 var(--hi) inset, 0 0 0 1px color-mix(in srgb, var(--stat-accent, var(--accent)) 70%, transparent), 0 20px 60px -18px rgba(var(--acc-rgb),.55); }
  .stat-icon { box-shadow: 0 0 18px -2px color-mix(in srgb, var(--stat-accent, var(--accent)) 60%, transparent); color: var(--stat-accent, var(--accent)); }
  .chart-bar { background: linear-gradient(180deg, var(--acc-hi) 0%, var(--accent) 45%, rgba(var(--acc-rgb),.1) 100%); opacity: 1; box-shadow: 0 0 14px -4px rgba(var(--acc-rgb),.7); }
  button.refresh { border-color: rgba(var(--acc-rgb),.5); color: var(--accent); }
  button.refresh:hover { background: var(--accent); color: #050505; box-shadow: 0 0 28px rgba(var(--acc-rgb),.5); }
  .call-card { border-color: rgba(var(--acc-rgb),.12); }
  .call-card:hover { box-shadow: 0 1px 0 var(--hi) inset, 0 26px 48px -20px var(--sh), 0 0 40px -6px rgba(var(--acc-rgb),.5); }
  .section-title { color: var(--ink); }
  ::selection { background: var(--accent); color: #050505; }
  :root[data-palette] { --bg:#040404;--surface:#0B0B0D;--surface-2:#131316;--ink:#F7F5F8;--ink-soft:#B7B4BD;--ink-faint:#75727D;--line:#25222C;--good:#5BE49B;--good-soft:#0E2419;--danger:#FF6B6B; }
  :root[data-palette][data-theme="light"] { --bg:#FAF8FB;--surface:#FFFFFF;--surface-2:#FCFAFD;--ink:#120F16;--ink-soft:#615B6B;--ink-faint:#A09AAB;--line:#E9E4EF;--good:#13875F;--good-soft:#DDF3EA;--danger:#C4453B; }
  :root[data-palette="magenta"] { --accent:#FF2E9A;--acc-hi:#FF9AD0;--accent-soft:#2C0A1C;--blue:#C58BFF;--blue-soft:#22192C;--acc-rgb:255,46,154;--blue-rgb:197,139,255; }
  :root[data-palette="magenta"][data-theme="light"] { --accent:#D4137A;--acc-hi:#D4137A;--accent-soft:#FFE3F1;--blue:#8A3FD6;--blue-soft:#FFE3F1;--acc-rgb:212,19,122; }
  :root[data-palette="mint"] { --accent:#19F0A8;--acc-hi:#B0FFE3;--accent-soft:#07291E;--blue:#8EE9FF;--blue-soft:#1A282C;--acc-rgb:25,240,168;--blue-rgb:142,233,255; }
  :root[data-palette="mint"][data-theme="light"] { --accent:#0A8F63;--acc-hi:#0A8F63;--accent-soft:#D9F8EC;--blue:#1B8FB0;--blue-soft:#D9F8EC;--acc-rgb:10,143,99; }
  :root[data-palette="crimson"] { --accent:#FF3B4E;--acc-hi:#FFA0A8;--accent-soft:#2C0C0F;--blue:#FFB59E;--blue-soft:#2C201C;--acc-rgb:255,59,78;--blue-rgb:255,181,158; }
  :root[data-palette="crimson"][data-theme="light"] { --accent:#D11F33;--acc-hi:#D11F33;--accent-soft:#FFE2E5;--blue:#C2542F;--blue-soft:#FFE2E5;--acc-rgb:209,31,51; }
  :root[data-palette="violet"] { --accent:#9D6BFF;--acc-hi:#D5C0FF;--accent-soft:#1C142C;--blue:#6BD6FF;--blue-soft:#14252C;--acc-rgb:157,107,255;--blue-rgb:107,214,255; }
  :root[data-palette="violet"][data-theme="light"] { --accent:#6D3DD6;--acc-hi:#6D3DD6;--accent-soft:#EAE0FF;--blue:#1D86B0;--blue-soft:#EAE0FF;--acc-rgb:109,61,214; }
  :root[data-palette="cyan"] { --accent:#22D3EE;--acc-hi:#B3F3FF;--accent-soft:#082529;--blue:#B197FC;--blue-soft:#1F1B2B;--acc-rgb:34,211,238;--blue-rgb:177,151,252; }
  :root[data-palette="cyan"][data-theme="light"] { --accent:#0A7F96;--acc-hi:#0A7F96;--accent-soft:#D8F5FB;--blue:#6A4FCF;--blue-soft:#D8F5FB;--acc-rgb:10,127,150; }
  :root[data-palette="amber"] { --accent:#FFB81C;--acc-hi:#FFE6A6;--accent-soft:#2C2007;--blue:#FFE08A;--blue-soft:#2C2719;--acc-rgb:255,184,28;--blue-rgb:255,224,138; }
  :root[data-palette="amber"][data-theme="light"] { --accent:#C77700;--acc-hi:#C77700;--accent-soft:#FFF0CC;--blue:#9A7A1E;--blue-soft:#FFF0CC;--acc-rgb:199,119,0; }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <div class="brand-eyebrow">Shree Roofing Solutions</div>
      <h1>Missed Calls</h1>
    </div>
    <div class="status-block">
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Loading…</span></div>
      <button class="refresh" id="refreshBtn">Refresh</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat active" data-filter="all" style="--stat-accent:var(--accent); --stat-soft:var(--accent-soft)">
      <div class="stat-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.36 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.34 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
      <div class="label">Missed calls handled</div>
      <div class="num" id="statTotal">–</div>
    </div>
    <div class="stat" data-filter="today" style="--stat-accent:var(--good); --stat-soft:var(--good-soft)">
      <div class="stat-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div class="label">Handled today</div>
      <div class="num" id="statToday">–</div>
    </div>
    <div class="stat" data-filter="week" style="--stat-accent:var(--blue); --stat-soft:var(--blue-soft)">
      <div class="stat-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></div>
      <div class="label">Handled this week</div>
      <div class="num" id="statWeek">–</div>
    </div>
  </div>

  <div class="chart-block">
    <div class="chart-label">Last 7 days</div>
    <div class="chart-bars" id="chartBars"></div>
  </div>

  <div class="section-header">
    <h2 class="section-title">Calls handled</h2>
    <input id="searchInput" type="text" class="search-inline" placeholder="Search by number…">
  </div>
  <section id="panel" class="card-grid"></section>

</div>

<script>
// ---- CONFIGURE YOUR SHEET HERE ----
const SHEET = { id: '1Q55UNkbbr8kdCMUZrwoXB5t6-on52M0MjQpg2ng9tjI', tab: 'Missed Call Log' };
const REFRESH_MS = 60000;
// -------------------------------------

function gvizUrl(id, tab) { return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}&headers=1`; }
async function fetchSheet(id, tab) {
  const res = await fetch(gvizUrl(id, tab));
  const text = await res.text();
  const m = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]+)\);?\s*$/);
  if (!m) throw new Error('parse failure');
  const json = JSON.parse(m[1]);
  if (!json.table || !json.table.rows) return [];
  return json.table.rows.map(r => (r.c || []).map(c => (c && (c.f ?? c.v)) ? String(c.f ?? c.v) : ''));
}
function fmtTime(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso || '—';
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function isToday(iso) { const d = new Date(iso); return !isNaN(d) && d.toDateString() === new Date().toDateString(); }
function isThisWeek(iso) { const d = new Date(iso); if (isNaN(d)) return false; const now = new Date(); const diff = (now - d) / 86400000; return diff >= 0 && diff <= 7; }
function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let rows = [], uid = 0, searchText = '', statFilter = 'all';
function getFiltered() {
  const q = searchText.trim().toLowerCase();
  let out = q ? rows.filter(r => (r[0] || '').toLowerCase().includes(q)) : rows;
  if (statFilter === 'today') out = out.filter(r => isToday(r[1]));
  if (statFilter === 'week') out = out.filter(r => isThisWeek(r[1]));
  return out;
}
function animateNumber(el, target) {
  target = Number(target) || 0;
  const start = Number(el.dataset.val || 0);
  const t0 = performance.now();
  function step(now) {
    const p = Math.min(1, (now - t0) / 500);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(start + (target - start) * eased);
    if (p < 1) requestAnimationFrame(step); else el.dataset.val = target;
  }
  requestAnimationFrame(step);
}
const emptyIcon = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.36 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.34 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';

function render() {
  const el = document.getElementById('panel');
  if (!rows.length) { el.innerHTML = `<div class="empty">${emptyIcon}<strong>No missed calls yet</strong>Automatic replies to unanswered calls will appear here.</div>`; return; }
  const filtered = getFiltered();
  if (!filtered.length) { el.innerHTML = `<div class="empty">${emptyIcon}<strong>No matches</strong>Nothing matches this filter or search.</div>`; return; }
  el.innerHTML = filtered.slice().reverse().map((r, idx) => {
    const [caller, callTime, sms] = r;
    return `<div class="call-card" style="animation-delay:${idx * 30}ms" onclick="openCallModal('${esc(caller)}','${esc(callTime)}')">
      <div class="card-top">
        <span class="card-time">${fmtTime(callTime)}</span>
        <span class="badge ${sms ? '' : 'no-reply'}">${sms ? 'Replied' : 'No reply'}</span>
      </div>
      <div class="card-name">${esc(caller)}</div>
      <div class="card-sub">${esc(sms) || 'No reply text recorded.'}</div>
      <div class="card-foot">Tap to view →</div>
    </div>`;
  }).join('');
}
window.openCallModal = function(caller, callTime) {
  const callRow = rows.find(r => r[0] === caller && r[1] === callTime);
  if (!callRow) return;
  const [phone, time, sms] = callRow;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'callModal';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head">
        <h3 class="modal-title">${esc(phone)}</h3>
        <button class="modal-close" onclick="closeCallModal()">✕</button>
      </div>
      <div class="modal-meta">${fmtTime(time)}</div>
      <div class="modal-section-label">Auto-reply sent</div>
      <div class="modal-msg-text">${esc(sms) || 'No reply text recorded.'}</div>
    </div>`;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCallModal(); });
  document.body.appendChild(overlay);
};
window.closeCallModal = function() {
  const el = document.getElementById('callModal');
  if (el) el.remove();
};
function updateStats() {
  animateNumber(document.getElementById('statTotal'), rows.length);
  animateNumber(document.getElementById('statToday'), rows.filter(r => isToday(r[1])).length);
  animateNumber(document.getElementById('statWeek'), rows.filter(r => isThisWeek(r[1])).length);
}
function renderChart() {
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const counts = days.map(d => rows.filter(r => { const rd = new Date(r[1]); return !isNaN(rd) && rd.toDateString() === d.toDateString(); }).length);
  const max = Math.max(1, ...counts);
  document.getElementById('chartBars').innerHTML = days.map((d, i) => `
    <div class="chart-bar-col">
      <div class="chart-count">${counts[i] || ''}</div>
      <div class="chart-bar" style="height:${Math.max(3, (counts[i] / max) * 100)}%"></div>
      <div class="chart-day">${d.toLocaleDateString(undefined, { weekday: 'short' })[0]}</div>
    </div>`).join('');
}
function setStatus(state, text) {
  document.getElementById('statusDot').className = 'dot' + (state === 'error' ? ' error' : '');
  document.getElementById('statusText').textContent = text;
}
async function loadAll() {
  setStatus('loading', 'Refreshing…');
  try {
    rows = await fetchSheet(SHEET.id, SHEET.tab);
    updateStats(); renderChart(); render();
    setStatus('live', 'Live · updated ' + new Date().toLocaleTimeString());
  } catch (err) {
    setStatus('error', 'Could not load data');
    document.getElementById('panel').innerHTML = `<div class="error-box"><strong>Can't reach the log.</strong><br>
      Make sure the Google Sheet is shared as "Anyone with the link can view", and that the Sheet ID in this file is correct. Then hit Refresh.</div>`;
  }
}
document.querySelectorAll('.stat').forEach(stat => {
  stat.addEventListener('click', () => {
    document.querySelectorAll('.stat').forEach(s => s.classList.remove('active'));
    stat.classList.add('active');
    statFilter = stat.dataset.filter;
    render();
  });
});
document.getElementById('refreshBtn').addEventListener('click', loadAll);
document.getElementById('searchInput').addEventListener('input', e => { searchText = e.target.value; render(); });
loadAll();
setInterval(loadAll, REFRESH_MS);
</script>
</body>
</html>
